name: Build & Release ReplayGain Plugin

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'Jellyfin.Plugin.ReplayGain/**'
      - 'Jellyfin.Plugin.ReplayGain.Tests/**'
      - 'build.yaml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [master]
    paths:
      - 'Jellyfin.Plugin.ReplayGain/**'
      - 'Jellyfin.Plugin.ReplayGain.Tests/**'
      - 'build.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install MinVer CLI
        run: dotnet tool install --global minver-cli
      - name: Resolve version
        id: version
        shell: bash
        run: |
          SEMVER=$(minver -t v -p preview -v error)
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          BASE=$(echo "$SEMVER" | sed 's/-.*//')
          if echo "$SEMVER" | grep -q '-'; then
            # JPRM requires a four-part numeric version. Use the number of
            # commits after the latest version tag so it increases without
            # creating a tag for every nightly build.
            LAST_STABLE_TAG=$(git tag --merged HEAD --sort=-creatordate \
              | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
            if [[ -n "$LAST_STABLE_TAG" ]]; then
              NIGHTLY_NUMBER=$(git rev-list --count "${LAST_STABLE_TAG}..HEAD")
            else
              NIGHTLY_NUMBER=$(git rev-list --count HEAD)
            fi
            JPRM_VERSION="${BASE}.${NIGHTLY_NUMBER}"
          else
            JPRM_VERSION="${BASE}.0"
          fi
          echo "version=${JPRM_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          dotnet-target: net9.0
          version: ${{ steps.version.outputs.version }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: replaygain-build-artifact
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.jprm.outputs.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: replaygain-build-artifact
          path: ./release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./release-assets/*
          generate_release_notes: true
          prerelease: false

  publish-manifest:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name != 'pull_request' && needs.build.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && github.ref_type != 'tag')) }}
    concurrency:
      group: replaygain-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: replaygain-build-artifact
          path: ./release-assets
      - name: Build manifest
        env:
          CHANGELOG: ${{ github.event.head_commit.message || '' }}
        shell: bash
        run: |
          mkdir -p pages
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -sSfL "${PAGES_URL}/manifest.json" -o pages/manifest.json || echo '[]' > pages/manifest.json
          if ! jq -e 'type == "array"' pages/manifest.json >/dev/null 2>&1; then
            echo '[]' > pages/manifest.json
          fi
          ZIP_FILE=$(find ./release-assets -maxdepth 1 -name '*.zip' -print -quit)
          ZIP_NAME=$(basename "$ZIP_FILE")
          CHECKSUM=$(md5sum "$ZIP_FILE" | awk '{print $1}')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="${{ needs.build.outputs.version }}"
          IS_STABLE=false
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_STABLE=true
            SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"
          else
            SOURCE_URL="${PAGES_URL}/artifacts/${VERSION}.zip"
          fi
          mkdir -p pages/artifacts

          # Keep nightly files from the currently deployed Pages site.
          if [[ "$IS_STABLE" != true ]] && [[ -f pages/manifest.json ]]; then
            jq -r '.[].versions[]? | select((.sourceUrl? // "") | contains("/artifacts/")) | .sourceUrl' pages/manifest.json \
              | while read -r URL; do
                  FILE="pages/artifacts/$(basename "$URL")"
                  curl -sSfL "$URL" -o "$FILE" || rm -f "$FILE"
                done
          fi
          cp "$ZIP_FILE" "pages/artifacts/${VERSION}.zip"

          # A stable release starts a new nightly cycle.
          if [[ "$IS_STABLE" == true ]] && [[ -f pages/manifest.json ]]; then
            jq 'map(.versions = [(.versions // [])[] | select(((.sourceUrl? // "") | contains("/artifacts/")) | not)])' \
              pages/manifest.json > pages/manifest.tmp
            mv pages/manifest.tmp pages/manifest.json
            rm -f pages/artifacts/*.zip
          fi
          GUID=$(grep '^guid:' build.yaml | awk '{print $2}' | tr -d '"')
          NAME=$(grep '^name:' build.yaml | awk '{print $2}' | sed 's/^"//;s/"$//')
          DESCRIPTION=$(grep '^overview:' build.yaml | sed 's/^overview: *//' | tr -d '"')
          OWNER=$(grep '^owner:' build.yaml | awk '{print $2}' | tr -d '"')
          CATEGORY=$(grep '^category:' build.yaml | awk '{print $2}' | tr -d '"')
          TARGET_ABI=$(grep '^targetAbi:' build.yaml | awk '{print $2}' | tr -d '"')
          NEW_VERSION=$(jq -n --arg ver "${{ needs.build.outputs.version }}" --arg changelog "$CHANGELOG" --arg targetAbi "$TARGET_ABI" --arg sourceUrl "$SOURCE_URL" --arg checksum "$CHECKSUM" --arg timestamp "$TIMESTAMP" '{version:$ver,changelog:$changelog,targetAbi:$targetAbi,sourceUrl:$sourceUrl,checksum:$checksum,timestamp:$timestamp}')
          if [ "$(jq --arg guid "$GUID" 'map(select(.guid == $guid)) | length' pages/manifest.json)" -gt 0 ]; then
            jq --arg guid "$GUID" --argjson newver "$NEW_VERSION" 'map(if .guid == $guid then .versions = [$newver] + .versions else . end)' pages/manifest.json > pages/manifest.tmp
          else
            jq --arg guid "$GUID" --arg name "$NAME" --arg description "$DESCRIPTION" --arg overview "$DESCRIPTION" --arg owner "$OWNER" --arg category "$CATEGORY" --argjson newver "$NEW_VERSION" '. += [{guid:$guid,name:$name,description:$description,overview:$overview,owner:$owner,category:$category,versions:[$newver]}]' pages/manifest.json > pages/manifest.tmp
          fi
          mv pages/manifest.tmp pages/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
